<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#150F2E">
<title>My Account | Stackly Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#7C3AED;--p2:#6D28D9;--ink:#150F2E;--ink2:#241A4A;--acc:#FBBF24;--bg:#F8F6FF;--line:#E4DDF6;--mut:#6B6890;--ok:#2fae66;--bad:#e5484d;--fh:'Playfair Display',serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--sw:250px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:clip}
body{font-family:var(--fb);background:var(--bg);color:#1E1B3A;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}ul{list-style:none}img{max-width:100%;display:block}
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:min(var(--sw),86vw);z-index:50;display:flex;flex-direction:column;padding:20px 14px;color:#fff;overflow-y:auto;background:radial-gradient(circle at 10% 0,rgba(124,58,237,.45),transparent 50%),linear-gradient(170deg,var(--ink2),var(--ink))}
.brand{display:flex;justify-content:center;margin-bottom:14px}.brand img{height:56px;width:auto}
.x{display:none;position:absolute;right:10px;top:14px;width:34px;height:34px;color:#fff}
.grp{font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.4);margin:16px 10px 6px}
.nav{display:grid;gap:3px}
.nav>*{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-size:.9rem;font-weight:600;color:rgba(255,255,255,.75);text-align:left;transition:.2s}
.nav i{width:18px;text-align:center}
.nav>*:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(3px)}
.nav .on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.9)}
.nav .n{margin-left:auto;font-size:.68rem;padding:1px 8px;border-radius:99px;background:var(--acc);color:var(--ink)}
.su{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.su div{min-width:0}.su b{display:block;font-size:.85rem;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su small{display:block;font-size:.7rem;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--fh);font-weight:700;text-transform:uppercase;background:var(--acc);color:var(--ink)}
.lo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:10px;border-radius:10px;font-size:.8rem;font-weight:700;color:#ff9a9d;background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.3)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,8,25,.6);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.25s}.ov.show{opacity:1;visibility:visible}
.main{flex:1;min-width:0;margin-left:var(--sw)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:64px;background:rgba(248,246,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--fh);font-size:1.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);place-items:center}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.shop{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;font-size:.82rem;font-weight:700;color:#fff;background:var(--p);transition:.2s}.shop:hover{background:var(--p2)}
.content{padding:24px 28px 56px;max-width:1360px;margin:0 auto}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 32px;margin-bottom:20px;border-radius:18px;color:#fff;background:radial-gradient(circle at 12% 0,rgba(124,58,237,.6),transparent 55%),radial-gradient(circle at 95% 100%,rgba(251,191,36,.2),transparent 45%),linear-gradient(135deg,var(--ink2),var(--ink))}
.hero>*{position:relative;z-index:1}
.hero .staff{position:absolute;inset:0;z-index:0;opacity:.6;background:repeating-linear-gradient(to bottom,transparent 0 30px,rgba(255,255,255,.07) 30px 31px,transparent 31px 42px)}
.eb{font-size:.72rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--acc);margin-bottom:6px}
.hero h2{font-family:var(--fh);font-size:2.3rem;line-height:1.1;margin-bottom:8px;text-transform:capitalize}
.hero p{max-width:500px;opacity:.78;line-height:1.6;font-size:.95rem}
.eq{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:16px}
.eq i{width:5px;height:100%;border-radius:3px;background:linear-gradient(to top,var(--p),var(--acc));transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:.88rem;border:1.5px solid var(--p);background:var(--p);color:#fff;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(124,58,237,.8)}
.btn.amb{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.gh{background:transparent;color:var(--p)}.btn.sm{padding:6px 12px;font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);transition:.25s}
.stat:hover{transform:translateY(-4px);border-color:var(--p);box-shadow:0 18px 30px -18px rgba(124,58,237,.6)}
.stat i{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;margin-bottom:12px;color:var(--p);background:rgba(124,58,237,.1)}
.stat b{display:block;font-family:var(--fh);font-size:2rem;line-height:1}
.stat small{display:block;margin-top:4px;font-size:.78rem;color:var(--mut);font-weight:600}
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;align-items:start}.g2>*{min-width:0}
.card{padding:22px;margin-bottom:16px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:0}.g2 .card{margin-bottom:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h3{font-family:var(--fh);font-size:1.3rem}.ch p{font-size:.8rem;color:var(--mut);margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;padding:0 10px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--mut);border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid var(--line);font-size:.86rem}tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(124,58,237,.05)}
.t2{font-size:.75rem;color:var(--mut);margin-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap}
.s-processing{background:rgba(251,191,36,.25);color:#8a6206}.s-shipped{background:rgba(124,58,237,.14);color:var(--p2)}.s-delivered{background:rgba(47,174,102,.15);color:#1f8a4f}
.feed li{display:flex;gap:12px;padding:11px 4px;border-radius:10px}.feed li:hover{background:rgba(124,58,237,.05)}
.feed i{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:.85rem;background:rgba(124,58,237,.1);color:var(--p)}
.feed p{font-size:.85rem;line-height:1.45}.feed small{font-size:.74rem;color:var(--mut)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:16px}
.pc{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);transition:.25s}
.pc:hover{transform:translateY(-4px);box-shadow:0 18px 30px -18px rgba(124,58,237,.6)}
.pc img{height:160px;width:100%;object-fit:cover}
.pc div{padding:14px}.pc h4{font-size:.92rem;margin-bottom:4px}
.pr{font-weight:800;color:var(--p);margin-bottom:10px}.pc .row{display:flex;gap:8px}.pc .row .btn{flex:1;justify-content:center}
.sr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.sr:last-child{border-bottom:0}
.sr b{display:block;font-size:.92rem}.sr small{color:var(--mut);font-size:.8rem}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:#D8D1EE;transition:.3s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.sw.on{background:var(--p)}.sw.on::after{transform:translateX(20px)}
.prof{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}.prof .av{width:64px;height:64px;font-size:1.8rem;background:var(--p);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;z-index:100;max-width:calc(100vw - 32px);text-align:center;transform:translate(-50%,20px);padding:12px 20px;border-radius:10px;background:var(--ink);color:#fff;font-size:.86rem;opacity:0;pointer-events:none;transition:.3s var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1024px){.side{transform:translateX(-100%);transition:transform .35s var(--ease)}.side.open{transform:none}.main{margin-left:0}.x,.burger{display:grid}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.content{padding:18px 16px 44px}.top{padding:10px 14px}.shop span{display:none}.hero{padding:24px 20px}.hero h2{font-size:1.8rem}.top h1{font-size:1.3rem}}
@media(max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}.card{padding:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}

/* ---- Polished mobile drawer + hamburger ---- */
@keyframes navIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .side{width:min(300px,84vw);padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:0 24px 24px 0;box-shadow:24px 0 60px -20px rgba(0,0,0,.65)}
  .brand{margin:4px 0 18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.1)}
  .brand img{height:54px}
  .x{top:18px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:1rem;transition:.25s}
  .x:hover,.x:active{background:var(--acc);color:var(--ink);transform:rotate(90deg)}
  .grp{margin:8px 10px 10px}
  .nav{gap:6px}
  .nav>*{padding:13px 14px;font-size:.95rem}
  .nav i{width:20px;font-size:1rem}
  .side.open .nav>*{animation:navIn .45s var(--ease) both}
  .side.open .nav>*:nth-child(2){animation-delay:.06s}
  .side.open .nav>*:nth-child(3){animation-delay:.12s}
  .side.open .nav>*:nth-child(4){animation-delay:.18s}
  .su{margin-top:auto;padding:12px}
  .ov{background:rgba(10,8,25,.65);backdrop-filter:blur(4px)}
  .burger{width:42px;height:42px;border:0;color:#fff;font-size:1.05rem;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 16px -8px rgba(124,58,237,.9);transition:transform .2s}
  .burger:active{transform:scale(.93)}
}
/* ---- Close button alignment fix ---- */
@media (max-width: 1024px) {
  .x {
    top: 35px;                 /* logo center = 22 + 4 + 27 = 53px, minus half the button (18px) */
    right: 14px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: grid;
    place-items: center;       /* centers the × inside the circle */
    line-height: 1;
    font-size: 1rem;
  }
  .x i {
    display: block;
    line-height: 1;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="ov" id="ov"></div>
  <aside class="side" id="side">
    <button class="x" id="closeSide" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
    <a href="../index.html" class="brand"><img src="../assets/stackly_logo.webp" alt="Stackly"></a>
    <p class="grp">My account</p><nav class="nav" id="navMain"></nav>
    <div class="su"><span class="av" id="sAv">?</span><div><b id="sName">Musician</b><small id="sMail">&mdash;</small></div></div>
    <button class="lo" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </aside>

  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <h1 id="title">Dashboard</h1>
      <div class="tr"><a href="./products.html" class="shop"><i class="fa-solid fa-bag-shopping"></i><span>Continue shopping</span></a><span class="av" id="tAv">?</span></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  /* ---- Session (saved by login.js) ---- */
  var user = null;
  try { if (localStorage.getItem('isAuthenticated') === 'true') user = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) {}
  if (!user || !user.email) { location.replace('./login.html'); return; }
  if (user.role === 'admin') { location.replace('./admin-dashboard.html'); return; }

  var email = user.email, name = email.split('@')[0], ini = name.charAt(0).toUpperCase();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var usd = function (n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2 }); };
  var tt;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function logout() { ['user', 'isAuthenticated', 'stacklyNav'].forEach(function (k) { localStorage.removeItem(k); }); location.href = './login.html'; }

  /* ---- Sample data (replace with real data later) ---- */
  var IMG = function (id) { return 'https://images.unsplash.com/' + id + '?auto=format&fit=crop&w=600&q=70'; };
  var orders = [
    { id: 'ST-2041', item: 'Aura Deluxe Acoustic Guitar', date: 'Sep 24, 2026', amt: 799, st: 'shipped' },
    { id: 'ST-2036', item: 'Studio Condenser Mic', date: 'Sep 18, 2026', amt: 299, st: 'processing' },
    { id: 'ST-2019', item: 'Pro 88-Key Stage Keyboard', date: 'Sep 2, 2026', amt: 1249, st: 'delivered' },
    { id: 'ST-1987', item: 'Classic Violin Master Series', date: 'Aug 15, 2026', amt: 680, st: 'delivered' }
  ];
  var wish = [
    { t: 'Master Custom Drum Kit', p: 1599, i: 'photo-1519892300165-cb5542fb47c7' },
    { t: 'Vintage Electric Sunburst Guitar', p: 949, i: 'photo-1550291652-6ea9114a47b1' },
    { t: 'Studio Condenser Mic', p: 299, i: 'photo-1590602847861-f357a9332bbc' }
  ];
  var feed = [
    { i: 'fa-truck-fast', t: 'Your Aura Deluxe Acoustic Guitar has shipped', w: '2h ago' },
    { i: 'fa-tag', t: 'Weekly deal: up to 35% off studio monitoring gear', w: '1d ago' },
    { i: 'fa-heart', t: 'Master Custom Drum Kit is back in stock', w: '2d ago' },
    { i: 'fa-circle-check', t: 'Pro 88-Key Stage Keyboard was delivered', w: '3w ago' }
  ];
  var pages = {
    dashboard: { t: 'Dashboard', i: 'fa-gauge-high' }, orders: { t: 'My Orders', i: 'fa-box' },
    wishlist: { t: 'Wishlist', i: 'fa-heart' }, settings: { t: 'Settings', i: 'fa-gear' }
  };
  var prefs = { ship: true, deals: true, news: false };

  function tag(s) { return '<span class="tag s-' + s + '">' + s.charAt(0).toUpperCase() + s.slice(1) + '</span>'; }
  function stat(i, ic, v, l, d) { return '<div class="stat rise" style="--i:' + i + '"><i class="fa-solid ' + ic + '"></i><b data-c="' + v + '">0</b><small>' + l + '</small></div>'; }
  function rows(list) {
    return list.map(function (o) { return '<tr><td><b>' + esc(o.item) + '</b><div class="t2">' + o.id + '</div></td><td>' + o.date + '</td><td><b>' + usd(o.amt) + '</b></td><td>' + tag(o.st) + '</td></tr>'; }).join('');
  }
  var head = '<thead><tr><th>Item</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>';
  function wcard(w, k) {
    return '<div class="pc rise" style="--i:' + k + '"><img src="' + IMG(w.i) + '" alt="' + esc(w.t) + '" loading="lazy"><div><h4>' + esc(w.t) + '</h4><p class="pr">' + usd(w.p) + '</p><div class="row"><button class="btn sm" data-cart="' + esc(w.t) + '"><i class="fa-solid fa-bag-shopping"></i> Add</button><button class="btn gh sm" data-rm="' + k + '" aria-label="Remove"><i class="fa-solid fa-trash"></i></button></div></div></div>';
  }
  function tog(k, t, s) { return '<div class="sr"><div><b>' + t + '</b><small>' + s + '</small></div><button class="sw' + (prefs[k] ? ' on' : '') + '" data-t="' + k + '" role="switch" aria-checked="' + prefs[k] + '" aria-label="' + t + '"></button></div>'; }
  var eq = '<div class="eq" aria-hidden="true">' + new Array(14).join('<i></i>').replace(/<i><\/i>/g, function () { return '<i style="animation-delay:' + (Math.random() * 1).toFixed(2) + 's"></i>'; }) + '</div>';

  var views = {
    dashboard: function () {
      var spent = orders.reduce(function (a, o) { return a + o.amt; }, 0);
      return '<div class="hero rise"><div class="staff"></div><div><div class="eb">Welcome back</div><h2>Hello, ' + esc(name) + '</h2><p>Track your orders, revisit your wishlist and discover new gear picked for your sound.</p>' + eq + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn amb" href="./products.html"><i class="fa-solid fa-guitar"></i> Shop instruments</a><a class="btn gh" style="color:#fff;border-color:rgba(255,255,255,.4)" href="./soundstudio.html">Sound Studio</a></div></div>' +
        '<section class="stats">' + stat(1, 'fa-box', orders.length, 'Total orders') + stat(2, 'fa-truck-fast', 1, 'On the way') + stat(3, 'fa-heart', wish.length, 'Wishlist items') + stat(4, 'fa-star', Math.round(spent / 10), 'Reward points') + '</section>' +
        '<section class="g2"><div class="card rise" style="--i:5"><div class="ch"><div><h3>Recent orders</h3><p>Your latest purchases</p></div><button class="btn gh sm" data-nav="orders">View all</button></div><div class="tw"><table>' + head + '<tbody>' + rows(orders.slice(0, 3)) + '</tbody></table></div></div>' +
        '<div class="card rise" style="--i:6"><div class="ch"><div><h3>Activity</h3><p>Latest updates</p></div></div><ul class="feed">' + feed.map(function (f) { return '<li><i class="fa-solid ' + f.i + '"></i><div><p>' + f.t + '</p><small>' + f.w + '</small></div></li>'; }).join('') + '</ul></div></section>' +
        '<div class="card rise" style="--i:7"><div class="ch"><div><h3>From your wishlist</h3><p>Ready when you are</p></div><button class="btn gh sm" data-nav="wishlist">See all</button></div><div class="pg">' + wish.map(wcard).join('') + '</div></div>';
    },
    orders: function () {
      return '<div class="card rise"><div class="ch"><div><h3>My orders</h3><p>Everything you have bought from Stackly</p></div><a class="btn sm" href="./products.html">Shop more</a></div><div class="tw"><table>' + head + '<tbody>' + rows(orders) + '</tbody></table></div></div>';
    },
    wishlist: function () {
      return '<div class="card rise"><div class="ch"><div><h3>My wishlist</h3><p>' + wish.length + ' saved instrument' + (wish.length === 1 ? '' : 's') + '</p></div></div>' +
        (wish.length ? '<div class="pg">' + wish.map(wcard).join('') + '</div>' : '<p style="color:var(--mut)">Your wishlist is empty. <a href="./products.html" style="color:var(--p);font-weight:700">Browse instruments</a></p>') + '</div>';
    },
    settings: function () {
      return '<div class="card rise"><div class="ch"><div><h3>Profile</h3><p>Your account details</p></div></div><div class="prof"><span class="av">' + esc(ini) + '</span><div><h3 style="font-family:var(--fh);text-transform:capitalize">' + esc(name) + '</h3><small style="color:var(--mut)">' + esc(email) + '</small></div></div></div>' +
        '<div class="card rise" style="--i:1"><div class="ch"><div><h3>Notifications</h3><p>Choose what you hear from us</p></div></div>' +
        tog('ship', 'Order updates', 'Shipping and delivery alerts') + tog('deals', 'Deal alerts', 'Weekly offers on gear you like') + tog('news', 'Newsletter', 'Tips, reviews and new arrivals') + '</div>' +
        '<div class="card rise" style="--i:2"><div class="ch"><div><h3>Session</h3><p>Signed in as ' + esc(email) + '</p></div></div><button class="btn" id="setLo" style="background:var(--bad);border-color:var(--bad)"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>';
    }
  };

  var cur = localStorage.getItem('stacklyNav'); if (!pages[cur]) cur = 'dashboard';
  function nav() {
    $('navMain').innerHTML = Object.keys(pages).map(function (k) {
      var n = k === 'wishlist' ? '<span class="n">' + wish.length + '</span>' : '';
      return '<button data-nav="' + k + '" class="' + (k === cur ? 'on' : '') + '"><i class="fa-solid ' + pages[k].i + '"></i>' + pages[k].t + n + '</button>';
    }).join('');
  }
  function count() {
    [].forEach.call(document.querySelectorAll('[data-c]'), function (el) {
      var end = +el.getAttribute('data-c'), t0 = null;
      (function step(t) { if (!t0) t0 = t; var p = Math.min((t - t0) / 800, 1); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(performance.now());
    });
  }
  function render() {
    $('title').textContent = pages[cur].t; $('content').innerHTML = views[cur](); nav(); scrollTo(0, 0); count();
    var b = $('setLo'); if (b) b.addEventListener('click', logout);
  }
  function side(open) { $('side').classList.toggle('open', open); $('ov').classList.toggle('show', open); document.body.style.overflow = open ? 'hidden' : ''; }

  ['sName'].forEach(function (id) { $(id).textContent = name; });
  $('sMail').textContent = email; $('sAv').textContent = ini; $('tAv').textContent = ini;
  $('burger').addEventListener('click', function () { side(true); });
  $('closeSide').addEventListener('click', function () { side(false); });
  $('ov').addEventListener('click', function () { side(false); });
  $('logoutBtn').addEventListener('click', logout);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') side(false); });
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]');
    if (n) { cur = n.getAttribute('data-nav'); localStorage.setItem('stacklyNav', cur); side(false); render(); return; }
    var c = e.target.closest('[data-cart]'); if (c) { toast(c.getAttribute('data-cart') + ' added to cart!'); return; }
    var r = e.target.closest('[data-rm]'); if (r) { wish.splice(+r.getAttribute('data-rm'), 1); toast('Removed from wishlist'); render(); return; }
    var t = e.target.closest('[data-t]');
    if (t) { var k = t.getAttribute('data-t'); prefs[k] = !prefs[k]; t.classList.toggle('on', prefs[k]); t.setAttribute('aria-checked', prefs[k]); }
  });
  render();
})();
</script>
</body>
</html>
