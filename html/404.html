      background:radial-gradient(circle, transparent 0 22%, #000 22% 24%, #1b1440 24% 27%, #000 27% 30%, #1b1440 30% 34%, #000 34% 38%, #1b1440 38% 43%, #000 43% 48%, #1b1440 48% 55%, #000 55%),
                 conic-gradient(from 0deg, rgba(255,255,255,.18), transparent 25%, rgba(255,255,255,.14) 50%, transparent 75%, rgba(255,255,255,.18));
      background-blend-mode:screen; box-shadow:0 0 0 3px rgba(255,255,255,.1), 0 20px 50px rgba(0,0,0,.6), 0 0 60px rgba(124,58,237,.5);
      animation:spin 4s linear infinite, drop .9s var(--ease) .08s both; transition:box-shadow .3s; }
    .vinyl::before { content:'\f001'; font-family:'Font Awesome 6 Free'; font-weight:900; position:absolute; inset:34%; border-radius:50%; display:grid; place-items:center;
      background:linear-gradient(135deg,var(--primary),#A855F7); color:var(--accent); font-size:clamp(.8rem,3vw,1.7rem); }
    .vinyl::after { content:''; position:absolute; left:50%; top:50%; width:7%; height:7%; margin:-3.5% 0 0 -3.5%; border-radius:50%; background:var(--secondary); }
    .vinyl:hover { box-shadow:0 0 0 3px var(--accent), 0 20px 50px rgba(0,0,0,.6), 0 0 80px rgba(251,191,36,.5); }
    .vinyl.wobble { animation:spin 1.2s linear infinite, shake .5s; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes shake { 20% { translate:-6px 0; } 40% { translate:6px 0; } 60% { translate:-4px 0; } 80% { translate:4px 0; } }

    .eq span:nth-child(2n) { animation-delay:.15s; } .eq span:nth-child(3n) { animation-delay:.4s; } .eq span:nth-child(5n) { animation-delay:.7s; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:14px 30px; border-radius:8px; border:2px solid transparent; font:700 1rem 'Plus Jakarta Sans',sans-serif; cursor:pointer; transition:all .3s var(--ease); }
    .btn-back { background:transparent; color:#fff; border-color:rgba(255,255,255,.4); }
    .btn-back:hover { background:#fff; color:var(--secondary); transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,.3); }

    .links a::after { content:''; position:absolute; left:0; bottom:-3px; width:0; height:2px; background:var(--accent); transition:width .3s var(--ease); }
    .links a:hover { color:var(--accent); } .links a:hover::after { width:100%; }

    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  <script>
    /* Go Back: exactly one step back in history; if there is none, go home */
    document.getElementById('backBtn').addEventListener('click', function () {
      if (window.history.length > 1) window.history.back();
      else window.location.href = '../index.html';
    });

    /* Cursor glow + icon parallax (pointer devices only) */
    var glow = document.getElementById('glow'), icons = document.querySelectorAll('.fl');
    if (window.matchMedia('(hover: hover)').matches) {
      window.addEventListener('pointermove', function (e) {
        glow.style.setProperty('--gx', e.clientX + 'px'); glow.style.setProperty('--gy', e.clientY + 'px');
        var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
        icons.forEach(function (el) { var d = +el.dataset.d; el.style.transform = 'translate(' + x * d + 'px,' + y * d + 'px)'; });
      });
    }

    /* Tap the record: a sad descending "wrong note" */
    var vinyl = document.getElementById('vinyl'), ctx;
    vinyl.addEventListener('click', function () {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      [392, 349.23, 311.13, 261.63].forEach(function (f, i) {
        var t = ctx.currentTime + i * .28, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle'; o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + .5);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .55);
      });
      vinyl.classList.remove('wobble'); void vinyl.offsetWidth; vinyl.classList.add('wobble');
      setTimeout(function () { vinyl.classList.remove('wobble'); }, 1300);
    });
  </script>
